<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGNGames</title>
<style>
  :root { --bg: #f5f3ff; --fg: #2f2a4a; --muted: #5e587e; --accent: #4f6cf7; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17142b; --fg: #ece9ff; --muted: #b3acd8; --accent: #8ea0ff; --card: #221e3d; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .game { display: flex; gap: 16px; align-items: center; background: var(--card); border-radius: 16px; padding: 16px; margin-top: 24px; }
  .game img { width: 96px; height: auto; flex: none; }
  .game h2 { font-size: 1.15rem; margin: 0; }
  .game p { margin: 4px 0 0; }
</style>
</head>
<body>
<main>
<h1>DGNGames</h1>
<p class="muted">Mobil oyunlar / Mobile games</p>

<div class="game">
  <img src="pixelparade/logo.png" alt="">
  <div>
    <h2><a href="pixelparade/">Pixel Parade</a></h2>
    <p>Boncuk bulmaca / Bead puzzle</p>
    <p><a href="pixelparade/privacy/">Gizlilik Politikası / Privacy Policy</a></p>
  </div>
</div>

<p class="muted" style="margin-top:32px">İletişim / Contact: <a href="mailto:dogan42osman@gmail.com">dogan42osman@gmail.com</a></p>
</main>
</body>
</html>
